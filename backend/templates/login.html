{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Sign in · Sentinel{% endblock %}
{% block bare %}
<div class="login-wrap">
  <div class="login-card card">
    <div class="login-brand">
      <span class="brand-mark big">{{ icon('shield') }}</span>
      <h1>Sentinel</h1>
      <p class="muted">AI intrusion detection · encrypted evidence · blockchain integrity</p>
    </div>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label>Username <input name="username" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide">Sign in</button>
    </form>
    <p class="muted small center">Authorised personnel only. All access is logged.</p>
  </div>
</div>
{% endblock %}
